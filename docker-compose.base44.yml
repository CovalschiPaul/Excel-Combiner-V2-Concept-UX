name: excel-combiner-ux

services:
  web:
    image: nginx:alpine
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.base44.conf:/etc/nginx/nginx.conf:ro
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      base44.project: "Excel Combiner UX"
      base44.kind: "web"
      base44.port: "3000"
