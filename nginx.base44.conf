# Full nginx main config for the Base44 dev sandbox.
# Runs workers as root because the repository checkout is mounted root-only
# (mode 0700), which the unprivileged `nginx` user cannot read.
user root;
worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        # The prototype wins at "/" as soon as it exists; the placeholder is the fallback.
        index excel-combiner-redesign.html index.html;

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-store";
        }

        # Keep repository metadata out of the served site.
        location ~ /\. {
            deny all;
            return 404;
        }
    }
}
